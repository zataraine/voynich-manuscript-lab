schema_version: "1.0"

stack:
  root_environment_variable: VOYNICH_LOCAL_AI
  default_root: /home/nyx/voynich-local-ai
  paths_file: state/paths.env

chat:
  base_url: http://127.0.0.1:8080/v1
  health_url: http://127.0.0.1:8080/health
  model: voynich-qwen
  timeout_seconds: 600
  default_max_tokens: 768
  default_temperature: 0.1
  enable_thinking: false
  review_system_prompt: config/prompts/routine-review-system-v1.txt
  review_user_prompt: config/prompts/routine-review-user-v1.txt

auxiliary:
  runner: bin/ai-aux-run
  ollama_url: http://127.0.0.1:11434
  embedding_model: qwen3-embedding:0.6b-q8_0
  critic_model: voynich-glm-critic:v1
  critic_modelfile: config/models/glm-critic-v1.Modelfile
  critic_system_prompt: config/prompts/adversarial-critic-system-v1.txt
  critic_user_prompt: config/prompts/adversarial-critic-user-v1.txt
  reranker_path_key: QWEN_RERANKER
  timeout_seconds: 1800

content_policy:
  embedding_allowed:
    - reference
    - metadata
    - research-note
  embedding_denied:
    - manuscript-transcription
    - voynichese
    - corpus
  max_request_bytes: 1048576
