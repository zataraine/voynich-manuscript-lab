schema_version: "1.0"

stack:
  root_environment_variable: VOYNICH_LOCAL_AI
  default_root: /home/nyx/voynich-local-ai
  paths_file: state/paths.env

chat:
  base_url: http://127.0.0.1:8080/v1
  health_url: http://127.0.0.1:8080/health
  model: voynich-qwen
  timeout_seconds: 600
  default_max_tokens: 768
  default_temperature: 0.1
  enable_thinking: false

auxiliary:
  runner: bin/ai-aux-run
  ollama_url: http://127.0.0.1:11434
  embedding_model: qwen3-embedding:0.6b-q8_0
  critic_model: glm-4.7-flash:q4_K_M
  reranker_path_key: QWEN_RERANKER
  timeout_seconds: 1800

content_policy:
  embedding_allowed:
    - reference
    - metadata
    - research-note
  embedding_denied:
    - manuscript-transcription
    - voynichese
    - corpus
  max_request_bytes: 1048576
