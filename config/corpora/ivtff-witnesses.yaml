comparison_policy:
  alignment_key: IVTFF page name plus canonical locus number
  diplomatic_surface: exact IVTFF text after physical continuation unwrapping
  reading_surface_excludes:
    - paragraph_start
    - paragraph_end
    - free_comment
    - text_tag
  retained_in_reading_surface:
    - alternatives
    - uncertainty
    - separators
    - ligatures
    - drawing_interruptions
  rule: Native strings are never compared across alphabets. Text agreement uses the official
    STA1 comparison_path files only. Lineage groups and derived_from edges remain explicit;
    agreement is never called independent corroboration. Alternate STA1 conversions are
    sensitivity views, not extra witnesses.
