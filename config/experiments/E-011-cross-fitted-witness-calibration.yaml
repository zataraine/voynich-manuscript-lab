  page_replicates: 1000
  seed: 20260905
  confidence: 0.95
null_model:
  replicates: 1024
  seed: 20260904
  statistic: median primary-pair Spearman after complete cross-fitting
  multiple_comparisons: Holm across all ten features
gates:
  minimum_worst_primary_spearman: 0.80
  minimum_worst_primary_bootstrap_lower: 0.70
