    compression:
      algorithms: [zlib, bz2, lzma]
      views: [raw, first-occurrence-canonical]
  controls:
    exact_decryption_ceiling: true
    same_family_new_document_diagnostic: true
    ciphertext_position_destruction: independently permute characters within each ciphertext with fixed seed
