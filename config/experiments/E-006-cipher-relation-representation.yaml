seed: 20260830
splits:
  train:
    grouping_key: complete source document
    assignment: two frozen E-005 document folds; complete evaluated cipher family absent in the primary regime
  heldout:
    grouping_key: complete source document plus complete cipher family
    assignment: one frozen E-005 document fold and all outputs from one cipher family
null_model:
  family: within-family-fold permutation of correct plaintext identities over frozen scored candidate matrices
  replicates: 256
metrics:
  primary:
    - median_family_normalized_mrr
    - worst_family_normalized_mrr
    - median_family_top1_lift_over_chance
    - worst_family_pair_roc_auc
    - permutation_one_sided_p
    - exact_roundtrip_fraction
    - worst_seed_mean_normalized_mrr
    - exact_decryption_ceiling_mrr
  interpretation_gates:
    minimum_median_family_normalized_mrr: 0.20
    minimum_worst_family_normalized_mrr: 0.05
    minimum_median_family_top1_lift: 2.5
    minimum_worst_family_pair_roc_auc: 0.55
    maximum_permutation_p: 0.05
    minimum_exact_roundtrip_fraction: 1.0
    minimum_worst_seed_mean_normalized_mrr: 0.15
    minimum_exact_decryption_ceiling_mrr: 1.0
  decision_rule: The named fused representation must pass all eight gates across the three fixed seeds. Diagnostic representations, same-family calibration, or destruction controls cannot replace it after execution. Passing permits an independently implemented replication suite, never Voynich scoring or a language/cipher/hoax posterior.
effects: {}
artifacts:
  root: artifacts/runs/E-006-cipher-relation-representation
notes: E-005 is an exposed benchmark. E-006 therefore tests one theoretically specified primary representation and treats all component results as diagnostics. The corpus, segments, document folds, cipher families, keys, candidate sets, normalization, and original six thresholds are frozen by hash. No pretrained semantic embeddings receive corpus or manuscript text.
