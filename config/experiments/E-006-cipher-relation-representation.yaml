      ngram_orders: [1, 2, 3]
      retained_sorted_counts: 64
      residue_periods: [1, 2, 3, 4, 5, 7, 8, 11, 13, 16, 20]
    modular_relation:
      modulus: 25
      periods: [1, 2, 3, 4, 5, 7, 8, 11, 13, 16, 20]
