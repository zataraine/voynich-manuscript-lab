normalization:
  version: gutenberg-latin25-ciphertext-only-v1
  description: Extract framed ebook bodies, retain A-Z, map J to I, select seeded nonoverlapping segments, generate matched controls, then expose only ADFGX ciphertext.
hypothesis_family: ciphertext-only-fractionation-transposition-structure-recovery
predecessor:
  experiment: E-008-blind-adfgx-replication
  result: artifacts/runs/E-008-blind-adfgx-replication/result.json
