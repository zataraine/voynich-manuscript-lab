[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "manuscript-lab"
version = "0.1.0"
description = "A provenance-first multimodal lab for a single unattested writing system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Private research workspace" }
dependencies = [
  "accelerate>=1.14,<2",
  "bitsandbytes>=0.50,<0.51; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "cryptography>=46,<51",
  "datasets>=5,<6",
  "deap>=1.4,<2",
  "duckdb>=1.4,<2",
  "gmpy2>=2.2,<3",
  "huggingface-hub>=1.4,<2",
  "jsonschema>=4.25,<5",
  "lxml>=6,<7",
  "matplotlib>=3.10,<4",
  "networkx>=3.6,<4",
  "numpy>=2.3,<3",
  "opencv-python-headless>=4.13,<5",
  "orjson>=3.11,<4",
  "ortools>=9.15,<10",
  "pandas>=2.3,<4",
  "pdfplumber>=0.11,<1",
  "pillow>=12,<13",
  "polars>=1.35,<2",
  "pyarrow>=22,<24",
  "pydantic>=2.12,<3",
  "pycryptodome>=3.23,<4",
  "pydivsufsort>=0.0.20,<1",
  "pypdf>=6,<7",
  "pynini>=2.1.7,<3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "pyyaml>=6,<7",
  "rapidfuzz>=3.14,<4",
  "regex>=2026.7,<2027",
  "rich>=14,<15",
  "scikit-image>=0.25,<1",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "seaborn>=0.13,<1",
  "sentence-transformers>=6,<7",
  "sentencepiece>=0.2,<1",
  "simanneal>=0.5,<1",
  "snakemake>=9.26,<10",
  "statsmodels>=0.14,<1",
  "timm>=1.0,<2",
  "torch>=2.13,<2.14",
  "torchvision>=0.28,<0.29",
  "transformers>=5.16,<6",
  "typer>=0.20,<1",
  "xxhash>=3.6,<4",
  "z3-solver>=5.1,<6",
  "pycipher",
]

[project.scripts]
manuscript-lab = "manuscript_lab.cli:app"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
]
notebook = [
  "ipykernel>=7,<8",
  "ipywidgets>=8,<9",
  "jupyterlab>=4.4,<5",
  "nbformat>=5.10,<6",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]
pycipher = { git = "https://github.com/jameslyons/pycipher", rev = "8f1d7cf3cba4e12171e27d9ce723ad890194de19" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/manuscript_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
branch = true
source = ["manuscript_lab"]
